[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicre"
version = "0.2.1"
description = "Local-first Linux metadata inventory and multi-dimensional readiness assessment"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "AICRE Project contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Filesystems",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4", "fastjsonschema==2.21.2"]

[project.scripts]
aicre = "aicre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
