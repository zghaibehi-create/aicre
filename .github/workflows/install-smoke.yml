name: Install smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-smoke.yml'
      - 'src/aicre/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/install-smoke.yml'
      - 'src/aicre/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        shell: bash
        run: |
          set -o pipefail
          python -m pip wheel --no-deps --wheel-dir dist .

      - name: Build source distribution with the locked setuptools backend
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --require-hashes -r .github/requirements-ci.txt
          mkdir -p dist-sdist
          python -c "from setuptools.build_meta import build_sdist; build_sdist('dist-sdist')"
          test -n "$(find dist-sdist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"

      - name: Inspect wheel and source distribution
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import tarfile
          import tomllib
          import zipfile
          from email.parser import Parser

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected_name = project["project"]["name"]
          expected_version = project["project"]["version"]
          init_text = pathlib.Path("src/aicre/__init__.py").read_text()
          assert f'__version__ = "{expected_version}"' in init_text

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          sdists = sorted(pathlib.Path("dist-sdist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert "aicre/__init__.py" in names, names
              metadata_paths = [n for n in names if n.endswith(".dist-info/METADATA")]
              assert len(metadata_paths) == 1, metadata_paths
              metadata = Parser().parsestr(archive.read(metadata_paths[0]).decode())
              assert metadata["Name"].lower() == expected_name.lower()
              assert metadata["Version"] == expected_version
              runtime_requirements = [
                  requirement for requirement in metadata.get_all("Requires-Dist", [])
                  if "extra ==" not in requirement
              ]
              assert not runtime_requirements, runtime_requirements
              print("Wheel inventory:")
              print("\\n".join(names))

          with tarfile.open(sdists[0], "r:gz") as archive:
              names = archive.getnames()
              root = names[0].split("/", 1)[0]
              required = [
                  f"{root}/pyproject.toml",
                  f"{root}/README.md",
                  f"{root}/LICENSE",
                  f"{root}/src/aicre/__init__.py",
                  f"{root}/PKG-INFO",
              ]
              missing = [name for name in required if name not in names]
              assert not missing, missing
              pkg_info = Parser().parsestr(archive.extractfile(f"{root}/PKG-INFO").read().decode())
              assert pkg_info["Name"].lower() == expected_name.lower()
              assert pkg_info["Version"] == expected_version
              runtime_requirements = [
                  requirement for requirement in pkg_info.get_all("Requires-Dist", [])
                  if "extra ==" not in requirement
              ]
              assert not runtime_requirements, runtime_requirements
              print("Source distribution required files: OK")

          for artifact in [wheels[0], sdists[0]]:
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              print(f"SHA256  {digest}  {artifact}")
          print(f"Distribution metadata and version checks: OK ({expected_name} {expected_version})")
          PY

      - name: Install wheel into a fresh virtual environment
        shell: bash
        run: |
          set -o pipefail
          python -m venv "$RUNNER_TEMP/aicre-wheel-venv"
          "$RUNNER_TEMP/aicre-wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/aicre-wheel-venv/bin/python" -m pip check
          "$RUNNER_TEMP/aicre-wheel-venv/bin/python" -c 'from importlib.metadata import distribution; requirements = distribution("aicre").requires or []; assert all("extra ==" in requirement for requirement in requirements), requirements'

      - name: Install source distribution into a fresh virtual environment
        shell: bash
        run: |
          set -o pipefail
          python -m venv "$RUNNER_TEMP/aicre-sdist-venv"
          "$RUNNER_TEMP/aicre-sdist-venv/bin/python" -m pip install --no-deps dist-sdist/*.tar.gz
          "$RUNNER_TEMP/aicre-sdist-venv/bin/python" -m pip check
          "$RUNNER_TEMP/aicre-sdist-venv/bin/python" -c 'from importlib.metadata import distribution; requirements = distribution("aicre").requires or []; assert all("extra ==" in requirement for requirement in requirements), requirements'

      - name: Exercise installed wheel and source-distribution commands
        shell: bash
        run: |
          set -o pipefail
          for ENV in "$RUNNER_TEMP/aicre-wheel-venv" "$RUNNER_TEMP/aicre-sdist-venv"; do
            AICRE="$ENV/bin/aicre"
            "$AICRE" --version
            "$AICRE" readiness --profile agent-development
            "$AICRE" report --format json | "$ENV/bin/python" -c 'import json, sys; report = json.load(sys.stdin); assert report["schema_version"] == "2.0"; assert len(report["readiness"]) == 5'
          done
