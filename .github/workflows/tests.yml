name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked CI toolchain and test dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements-ci.txt
          python -m pip install --no-build-isolation --no-deps -e '.[dev]'
          python -m pip check
      - name: Lint
        run: python -m ruff check src tests
      - name: Run tests
        run: python -m pytest -v
      - name: Check CLI entry point
        run: aicre --version
